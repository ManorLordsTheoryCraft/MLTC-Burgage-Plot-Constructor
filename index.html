  function layout() {
    if (state.autozoom) {
      var r = stageRect();
      // Keep the drawing scale the page always had - the old 900x868 viewBox
      // `meet`-fitted into the stage - so line weights, type and handles stay
      // exactly as they were.  The canvas is then sized in those units to cover
      // the stage, which fills the panel without changing how anything is drawn.
      var k = Math.min(r.w / 900, r.h / 868) || 1;
      W = Math.round(r.w / k);
      H = Math.round(r.h / k);
      return;
    }
    var ex = view.maxx - view.minx, ey = view.maxy - view.miny;
    // Odd rotations swap the axes on screen, so the canvas swaps too.
    if (state.rot & 1) {
      W = Math.ceil(ex * FIXED_S + 2 * PAD);
      H = Math.ceil(ey * FIXED_S + 2 * PAD);
    } else {
      W = Math.ceil(ey * FIXED_S + 2 * PAD);
      H = Math.ceil(ex * FIXED_S + 2 * PAD);
    }
  }

  function metrics() {
    // Display rotated 90 deg clockwise: a world vector (dx, dy) is drawn as
    // (-dy, dx) on screen, so world Y runs across (leftwards) and world X down.
    var w = Math.max(view.maxy - view.miny, 1e-6);   // horizontal: Y
    var h = Math.max(view.maxx - view.minx, 1e-6);   // vertical:   X
    // A 90/270 deg view rotation swaps the axes on screen, so the fit has to be
    // solved against the swapped canvas: the Y extent becomes vertical and the X
    // extent horizontal.  Fitting W x H in the drawing frame and then rotating
    // would overflow a non-square canvas.
    var s;
    if (!state.autozoom) { s = FIXED_S; }
    else if (state.rot & 1) { s = Math.min(W / h, H / w); }
    else { s = Math.min(W / w, H / h); }
    // Centred on both axes, and the rotation is about the canvas centre, so the
    // rotated picture stays centred too.
    return { s: s, w: w, h: h, ox: (W - w * s) / 2, oy: (H - h * s) / 2 };
  }

  function relayout() { layout(); M = metrics(); }

  // Screen pixels per drawing unit; the ruler's own offsets are specified in CSS
  // px (50 to the first row, 25 per step) so they do not scale with the plot.
  function pxPerUnit() {
    var w = 0;
    try { w = svg.getBoundingClientRect().width; } catch (e) { w = 0; }
    return (w > 0 && W > 0) ? w / W : 1;
  }

  // The ruler's two dimension bands live outside the plot, beyond +X (bottom on
  // screen) and +Y (left).  Offsets are converted from px to world units with the
  // live scale, so they read the same at any plot size.
  function rulerGeom() {
    var b = bbox(state.corners.concat([[0, 0, 0]]));
    var kpx = (M && M.s > 0 ? M.s : 0.15) * pxPerUnit();   // px per world unit
    if (!(kpx > 1e-6)) { kpx = 0.15; }
    return { b: b, pad: 50 / kpx, step: 25 / kpx };
  }

  function fitView() {
    var pts = state.corners.concat([[0, 0, 0]]);
    var b = bbox(pts);
    var w = Math.max(b.maxx - b.minx, 600), h = Math.max(b.maxy - b.miny, 600);
    var m = 0.12 * Math.max(w, h);
    view = { minx: b.minx - m, maxx: b.maxx + m, miny: b.miny - m, maxy: b.maxy + m };
    if (state.manual && state.ruler) {
      var rg = rulerGeom();
      view.maxx = Math.max(view.maxx, b.maxx + rg.pad + 6.6 * rg.step);
      view.maxy = Math.max(view.maxy, b.maxy + rg.pad + 6.6 * rg.step);
    }
    relayout();
  }

  // Fitting is a mode, not a one-shot (View card, on by default): while it is
  // on, every shape change re-fits the view to the plot.  Switched off, the
  // view bounds stay put, so two shapes can be compared at one scale - the
  // canvas still has to re-derive its size/metrics, hence relayout().
  function autoFit() {
    if (state.fitView) { fitView(); } else { relayout(); }
  }

  // world -> screen, display rotated clockwise 90 deg: (x, y) -> (-y, x).
  function sh(y) { return M.ox + (view.maxy - y) * M.s; }   // screen x of a world Y
  function sv(x) { return M.oy + (x - view.minx) * M.s; }   // screen y of a world X
  function sx(p) { return sh(p[1]); }
  function sy(p) { return sv(p[0]); }
  function toWorld(px, py) {
    return [
      (py - M.oy) / M.s + view.minx,
      view.maxy - (px - M.ox) / M.s
    ];
  }

  function poly(pts, attrs) {
    if (!pts || pts.length < 2) { return ""; }
    var d = pts.map(function (p) { return sx(p).toFixed(1) + "," + sy(p).toFixed(1); }).join(" ");
    var a = "";
    for (var k in attrs) { if (attrs[k] !== null && attrs[k] !== undefined) { a += " " + k + '="' + attrs[k] + '"'; } }
    return "<polygon points=\"" + d + "\"" + a + "/>";
  }
  function text(p, s, colour, dx, dy, size) {
    return "<text x=\"" + (sx(p) + dx).toFixed(1) + "\" y=\"" + (sy(p) + dy).toFixed(1) +
      "\" class=\"hlabel\" fill=\"" + colour + "\" font-size=\"" + (size || 11.5) + "\">" + s + "</text>";
  }

  // Centred on the point and rotated about it: used for the drag legs, whose
  // numbers sit on the dotted line.  A background halo keeps them readable
  // where the line runs underneath.
  function textRot(p, s, colour, dx, dy, size, deg) {
    var x = (sx(p) + dx).toFixed(1), y = (sy(p) + dy).toFixed(1);
    return "<text x=\"" + x + "\" y=\"" + y + "\" transform=\"rotate(" + deg + " " + x + " " + y + ")\"" +
      " text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"hlabel\" fill=\"" + colour +
      "\" paint-order=\"stroke\" stroke=\"var(--bg)\" stroke-width=\"3\"" +
      " stroke-linejoin=\"round\" font-size=\"" + (size || 11.5) + "\">" + s + "</text>";
  }

  // The A/B preview components are a 100x100 /Engine/BasicShapes/Plane scaled
  // 7x12 (A: 700x1200) and 4x8 (B: 400x800), sampling bluredFrame with plain
  // UV0 (full-bleed).  There is no separate frame transform: the shaded
  // rectangle is the texture's alpha interior, inset by its soft border.
  // This returns an SVG luminance mask that stretches the texture over the
  // exact screen quad, so the drawn house is the visible frame, not the canvas.
  function frameMask(id, p, dir, halfAlong, halfAcross) {
    // Display rotated 90 deg clockwise: world (dx, dy) is drawn as (-dy, dx),
    // so both the along and the across direction need converting.
    var ax = -dir[1], ay = dir[0];
    var nx = -dir[0], ny = -dir[1];
    var a = halfAlong * M.s, c = halfAcross * M.s;
    var ox = sx(p) - ax * a - nx * c;
    var oy = sy(p) - ay * a - ny * c;
    var m = "matrix(" + (2 * a * ax).toFixed(3) + " " + (2 * a * ay).toFixed(3) + " " +
            (2 * c * nx).toFixed(3) + " " + (2 * c * ny).toFixed(3) + " " +
            ox.toFixed(2) + " " + oy.toFixed(2) + ")";
    return "<mask id=\"" + id + "\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"" +
      W + "\" height=\"" + H + "\" style=\"mask-type:luminance\">" +
      "<image href=\"data:image/png;base64," + FRAME_B64 + "\" x=\"0\" y=\"0\" " +
      "width=\"1\" height=\"1\" preserveAspectRatio=\"none\" transform=\"" + m + "\"/></mask>";
  }

  // Grid numbers are collected here and rendered OUTSIDE the rotated group, on
  // the rotated block's left and bottom edges, so they always sit on those two
  // sides of the canvas.
  var pendingGridLabels = [];

  // Compass words, in the drawing frame.  They are drawn outside the rotated
  // group so an upright label keeps its own anchor: the map rotation is applied
  // to the anchor point only, then the word is nudged toward the canvas centre
  // and clamped inside it, so it is visible at every rotation without moving the
  // arrows.
  var compassText = [];

  function compassLabelsSvg() {
    var txt = [];
    for (var i = 0; i < compassText.length; i++) {
      var c = compassText[i], p = rotScreen(c.x, c.y);
      var dx = W / 2 - p[0], dy = H / 2 - p[1];
      var len = Math.hypot(dx, dy) || 1;
      var lx = p[0] + (dx / len) * 24, ly = p[1] + (dy / len) * 24;
      lx = Math.min(W - 34, Math.max(34, lx));
      ly = Math.min(H - 12, Math.max(16, ly));
      txt.push("<text class=\"glabel\" text-anchor=\"middle\" x=\"" + lx.toFixed(1) +
        "\" y=\"" + ly.toFixed(1) + "\" style=\"fill:#334155;font-weight:600\"" +
        " paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\">" +
        c.name + "</text>");
    }
    return txt.join("");
  }

  function gridLayer() {
    var out = [];
    // The paper fills the whole canvas, not just the fitted view window: lines
    // are drawn over a centred square of side max(W, H), which still covers the
    // canvas after any 90 deg view rotation (the root SVG clips the overhang).
    // The world range is read back from that square's edges with the inverse of
    // sh()/sv(), so the lattice stays locked to world multiples of STEP.
    //
    // The display is rotated 90 deg clockwise: X is the VERTICAL axis (ticks are
    // horizontal lines, numbers down the left edge) and Y the horizontal one
    // (ticks are vertical lines, numbers under the bottom edge).
    var S = Math.max(W, H), half = S / 2, cx = W / 2, cy = H / 2;
    var bx0 = cx - half, bx1 = cx + half, by0 = cy - half, by1 = cy + half;
    var yA = view.maxy - (bx0 - M.ox) / M.s;   // world Y at the square's left edge
    var yB = view.maxy - (bx1 - M.ox) / M.s;   // ... at its right edge
    var xA = view.minx + (by0 - M.oy) / M.s;   // world X at its top edge
    var xB = view.minx + (by1 - M.oy) / M.s;   // ... at its bottom edge
    var x0 = Math.ceil(Math.min(xA, xB) / STEP) * STEP;
    var xEnd = Math.max(xA, xB);
    var y0 = Math.ceil(Math.min(yA, yB) / STEP) * STEP;
    var yEnd = Math.max(yA, yB);
    var majorStep = Math.abs(STEP * 2);
    var clamp = function (v, lo, hi) { return Math.min(hi, Math.max(lo, v)); };
    // Keep tick text from colliding when the view is zoomed far out: number
    // every 1, 2, 4 ... major lines so the labels stay >= ~36 px apart.
    var labStride = 1;
    while (majorStep * M.s * labStride < 36) { labStride *= 2; }
    var numbered = function (v) {
      return Math.abs(Math.round(v / majorStep) % labStride) < 1e-9;
    };
    for (var x = x0; x <= xEnd; x += STEP) {
      var isAxis = Math.abs(x) < 1e-9;
      var major = Math.abs(Math.round(x) % majorStep) < 1e-9;
      out.push("<line x1=\"" + bx0.toFixed(1) + "\" y1=\"" + sv(x).toFixed(1) +
        "\" x2=\"" + bx1.toFixed(1) + "\" y2=\"" + sv(x).toFixed(1) +
        "\" stroke=\"" + (isAxis ? "var(--axis)" : major ? "var(--grid10)" : "var(--grid)") +
        "\" stroke-width=\"" + (isAxis ? 1.6 : 1) + "\"/>");
      // Numbers are drawn later, outside the rotation, along the canvas edges.
      if (major && numbered(x)) {
        pendingGridLabels.push({ kind: "x", v: Math.round(x), at: sv(x) });
      }
    }
    for (var y = y0; y <= yEnd; y += STEP) {
      var isAxisY = Math.abs(y) < 1e-9;
      var majorY = Math.abs(Math.round(y) % majorStep) < 1e-9;
      out.push("<line x1=\"" + sh(y).toFixed(1) + "\" y1=\"" + by0.toFixed(1) +
        "\" x2=\"" + sh(y).toFixed(1) + "\" y2=\"" + by1.toFixed(1) +
        "\" stroke=\"" + (isAxisY ? "var(--axis)" : majorY ? "var(--grid10)" : "var(--grid)") +
        "\" stroke-width=\"" + (isAxisY ? 1.6 : 1) + "\"/>");
      if (majorY && numbered(y)) {
        pendingGridLabels.push({ kind: "y", v: Math.round(y), at: sh(y) });
      }
    }
    // Compass arrows stay in the drawing frame; their labels are collected here
    // and placed in screen space (compassLabelsSvg) so an upright word anchored
    // at the axis end can never be carried off-canvas by the view rotation.
    var ex0 = 0, ex1 = W, ey0 = 0, ey1 = H;
    var ny = clamp(sv(0), ey0 + 8, ey1 - 8);
    if (ex1 > 26) {
      out.push("<path d=\"M " + (ex1 - 1).toFixed(1) + " " + ny.toFixed(1) +
        " L " + (ex1 - 13).toFixed(1) + " " + (ny - 6).toFixed(1) +
        " L " + (ex1 - 13).toFixed(1) + " " + (ny + 6).toFixed(1) +
        " Z\" fill=\"var(--axis)\"/>");
      compassText.push({ name: "North", x: ex1 - 12, y: ny - 9 });
    }
    var ex = clamp(sh(0), ex0 + 8, ex1 - 8);
    if (ey1 > 26) {
      out.push("<path d=\"M " + ex.toFixed(1) + " " + (ey1 - 1).toFixed(1) +
        " L " + (ex - 6).toFixed(1) + " " + (ey1 - 13).toFixed(1) +
        " L " + (ex + 6).toFixed(1) + " " + (ey1 - 13).toFixed(1) +
        " Z\" fill=\"var(--axis)\"/>");
      compassText.push({ name: "East", x: Math.min(W - 26, Math.max(26, ex + 10)), y: ey1 - 6 });
    }
    return out.join("");
  }

  // Map a base-frame screen point through the view rotation (same matrix as
  // the drawing group: rotate(-90*rot) about the canvas centre).
  function rotScreen(x, y) {
    if (!state.rot) { return [x, y]; }
    var cx = W / 2, cy = H / 2, dx = x - cx, dy = y - cy;
    if (state.rot === 1) { return [cx + dy, cy - dx]; }
    if (state.rot === 2) { return [cx - dx, cy - dy]; }
    return [cx - dy, cy + dx];
  }

  // Screen-space grid numbers: always the rotated canvas's LEFT and BOTTOM
  // edge, inset a few px and haloed in white so they stay readable on top of
  // the paper (the grid now runs edge to edge, so there is no outer gutter).
  function gridLabels() {
    if (!pendingGridLabels.length) { return ""; }
    var halo = " paint-order=\"stroke\" stroke=\"#fff\" stroke-width=\"3\" stroke-linejoin=\"round\"";
    var txt = [];
    for (var i = 0; i < pendingGridLabels.length; i++) {
      var L = pendingGridLabels[i];
      // Where the line lands after the view rotation, and whether it ends up
      // horizontal (left label) or vertical (bottom label).
      var q = (L.kind === "x") ? rotScreen(0, L.at) : rotScreen(L.at, 0);
      var horiz = (L.kind === "x") ? !(state.rot & 1) : !!(state.rot & 1);
      if (horiz) {
        txt.push("<text class=\"glabel\" text-anchor=\"start\" x=\"7\" y=\"" +
          Math.min(H - 6, Math.max(12, q[1] + 4)).toFixed(1) + "\"" + halo + ">" +
          L.v + "</text>");
      } else {
        txt.push("<text class=\"glabel\" text-anchor=\"middle\" x=\"" +
          Math.min(W - 16, Math.max(16, q[0])).toFixed(1) + "\" y=\"" +
          (H - 7).toFixed(1) + "\"" + halo + ">" + L.v + "</text>");
      }
    }
    return txt.join("");
  }

  function handle(p, i) {
    var x = sx(p), y = sy(p);
    var cx = x.toFixed(1), cy = y.toFixed(1);
    // A square handle means the point is locked to a rail and can only slide
    // along it: P1 on the street line while lock1 is on.  A circle is a free
    // corner.  P0 has no handle at all while it is pinned to the origin.
    var square = (i === 1 && state.lock1);
    var mark = square
      ? "<rect x=\"" + (x - 5.5).toFixed(1) + "\" y=\"" + (y - 5.5).toFixed(1) +
        "\" width=\"11\" height=\"11\" fill=\"#fff\" stroke=\"var(--plot)\" stroke-width=\"2.2\"/>"
      : "<circle cx=\"" + cx + "\" cy=\"" + cy + "\" r=\"7\" fill=\"#fff\" stroke=\"var(--plot)\" stroke-width=\"2.2\"/>";
    return "<g class=\"handle\"" + (square ? " data-axis=\"1\"" : "") + " data-i=\"" + i + "\">" +
      "<circle cx=\"" + cx + "\" cy=\"" + cy + "\" r=\"18\" fill=\"transparent\"/>" + mark + "</g>";
  }

  function cornerLabel(p, i) {
    return text(p, "P" + i, "#334155", 10, -10, 12.5);
  }

  // Centred label inside a polygon (house / shed decals).
  function labelAt(pts, s, colour, size) {
    var cx = 0, cy = 0;
    for (var i = 0; i < pts.length; i++) { cx += pts[i][0]; cy += pts[i][1]; }
    cx /= pts.length; cy /= pts.length;
    return "<text x=\"" + sx([cx, cy]).toFixed(1) + "\" y=\"" + sy([cx, cy]).toFixed(1) +
      "\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"hlabel\" fill=\"" +
      colour + "\" font-size=\"" + (size || 13) + "\" font-weight=\"600\">" + s + "</text>";
  }

  var last = null;
  var syncPreset = null;   // set by the Plot Control block; called on every render

  function compute() {
    var corners = state.corners;
    var wind = B.winding(corners);
    var geomOk = B.isSimpleQuad(corners);
    if (wind >= 0) {
      return {
        corners: corners, wind: wind, geomOk: geomOk, border: null,
        preview: null, aDecal: null, aDecalTrace: {},
        fit: { ok: false, reason: "corner order is reversed", trace: { rejected: [] } },
        houses: { primaryShape: null, secondaryShape: null }, beds: null,
        shed: null
      };
    }
    if (!geomOk) {
      return {
        corners: corners, wind: wind, geomOk: false, border: null,
        preview: null, aDecal: null, aDecalTrace: {},
        fit: { ok: false, reason: "plot is self-intersecting",
               trace: { rejected: [] } },
        houses: { primaryShape: null, secondaryShape: null }, beds: null,
        shed: null
      };
    }
    var closed = corners.concat([corners[0]]);
    var border = B.engineBorder(closed);
    var houses = B.fitHouses(corners, border);
    // The extracted-plot preview fit: this is what places the A decal and is the
    // source of the extension facade.  It is independent of the post-commit A-part
    // fit, so keep it separate from the backyard gate below.
    var preview = B.buildExtensionForPlot(corners, border);
    // The A decal is placed by the preview builder's own A fit (whole border,
    // start 700, 350x600, strict endpoint test), which can differ from the
    // extension facade fit (P3->P0 obstacle).  The same transform is the A box
    // that the preview B fit must clear.
    var aDecalTrace = {};
    var aDecal = B.previewA(corners, border, { trace: aDecalTrace });
    // The B decal is placed by the PREVIEW builder, FUN_144b43280 (called from
    // FUN_144b59950), not by constructResidential's B fit.  It walks P3->P0
    // from len-800, half 200x300, step -50, 12 iterations, and tests against
    // the whole border plus the A-preview box (700x1200 around the A
    // transform).  This is what makes B disappear when A blocks it, and it
    // reproduces the live 2026-11-08 B decal exactly (arc 1875.3315).
    var secTrace = {};
    var secondary = null;
    if (aDecal) {
      secondary = B.previewSecondary(corners, border, aDecal.origin,
                                     aDecal.dir, secTrace);
    } else {
      // The A fit found no station inside its 20 x 25 sweep, so the preview
      // element is not emitted at all: no A decal AND no B decal.  A secondary
      // building without its primary does not exist in the game, and the B
      // fit's obstacle is the A box -- there is no meaningful box to test
      // against when A was dropped.
      secTrace.reason = "A dropped \u2014 no preview element, so no B either";
      secTrace.aDropped = true;
    }
    // BPartWontFit is pushed AT COMMIT from the PREVIEW B, not from the
    // constructed fit: FUN_144b35700 copies the preview A/B into master+0xA60/
    // +0xAC0, then tests the preview B translation (pawn+0xfb0 element +0xA0)
    // with x^2 + y^2 < 1.0 and appends the FName to master+0x1E0.  Live
    // 2026-11-08: a B-present commit left the array 0/0, a B-absent commit
    // produced count 1.
    var bPartWontFit = secondary === null;
    // Once that tag is set, constructResidential's own B fit never runs: its
    // whole block is inside `if (local_21b2 != 0)` where
    // local_21b2 = !hasTag("BPartWontFit"), so the built B stays zero and the
    // decal spawner never draws one.  With the tag absent the stored B is the
    // preview B (non-zero), so that fit is reused and not re-run either.
    // Net: on a committed plot the constructed B fit is unreachable.
    var aFullFacade = false;
    if (bPartWontFit && houses.stepped) {
      houses = B.fitHouses(corners, border, { fullFacade: true });
      aFullFacade = true;
    }
    var fit = preview;
    // Engine rule: constructResidential writes backFacade only after the A-part
    // fit; FUN_144d54c70 needs that backFacade to make the extension.  No house
    // fit -> no backFacade -> no extension and no backyard beds.
    if (!aDecal) {
      // No A decal means no preview element was merged, so there is no
      // backFacade to copy either: the extension cannot exist.
      fit = { ok: false, reason: "A dropped \u2014 no preview element, so no backFacade",
              trace: (fit && fit.trace) || null };
    } else if (fit && fit.ok && !houses.houseShape) {
      fit = { ok: false, reason: "no house fit - no backyard", trace: fit.trace };
    }
    // FUN_144b59950's own backyard gate, applied after the facade slice: a
    // 400x400 box must clear inside the extension polygon, walked along its
    // C1->P2 side from arc 200 (step 30, 60 candidates, one 20 slide allowed).
    // If nothing clears the engine leaves the element's extensionTransform at
    // the default (translation 0): no backyard decal, and the plot tool counts
    // it as "no room for extension".
    var extGate = null;
    if (fit && fit.ok) {
      extGate = B.extensionClearance(fit.profile, fit.quad);
      if (!extGate.ok) {
        fit = { ok: false, reason: "Plot too small for backyard extension.",
                trace: fit.trace, gate: extGate };
      }
    }
    var beds = null, plants = null, plantsAt = null, shed = null, shedStandIn = false;
    if (fit.ok) {
      beds = B.buildBeds(fit.quad, state.frac, fit.profile);
      // No bed records -> the engine still rasterises the extension polygon
      // (live 2026-11-09: 0 beds, 188 plants, exact).  So plants do not
      // require beds.
      plants = B.plantGrid((beds && beds.ok) ? beds : {}, fit.quad, fit.profile);
      // The vegetable-garden shed (extension_vegetableShedA/B) is spawned at the
      // END of updateSubfield's type-8 case, i.e. AFTER all six bed cuts.  The
      // cut-1 guard (`if cornersA < 4 || cornersB < 4`) takes an early branch
      // that spawns only extension_clutter_* props and `break`s, so a 0-bed
      // extension gets NO shed and NO dirt planes (live 2026-11-17: the selected
      // P2-corner garden has buildings = [] and dirtPlanes = 0, while a bedded
      // one has 22 props + 5 planes).
      //
      // The page still keeps a reference point in that case: the same 300x300
      // box relocated to the primary house A transform, flagged as a stand-in,
      // so the Plan panel and Avg distance still read something meaningful.
      if (beds && beds.ok) {
        shed = B.shedMesh(fit.profile, fit.quad);
      } else {
        shed = B.shedAt(aDecal.origin, aDecal.dir);
        shedStandIn = true;
      }
      if (beds && beds.ok) {
        plantsAt = [0.0, 1.0].map(function (f) {
          var b = B.buildBeds(fit.quad, f, fit.profile);
          if (!b || !b.ok) { return null; }
          var pg = B.plantGrid(b, fit.quad, fit.profile);
          return pg ? pg.count : null;
        });
      }
    }
    return { corners: corners, wind: wind, geomOk: true, border: border,
             preview: preview, fit: fit, aDecal: aDecal, aDecalTrace: aDecalTrace,
             houses: houses, secondary: secondary, secTrace: secTrace,
             bPartWontFit: bPartWontFit, aFullFacade: aFullFacade,
             beds: beds, plants: plants, plantsAt: plantsAt, shed: shed,
             shedStandIn: shedStandIn };
  }

  // Coordinate text shared by the P0-P3 rows and the ?c= URL, so they always
  // show the same number (1 decimal, no trailing .0 on whole values).
  function fmtCoord(v) {
    var q = Math.round(v * 10) / 10;
    return (q % 1 === 0) ? String(q) : q.toFixed(1);
  }

  // --------------------------------------------------------------- quanta
  // Shorthand for the ruler: the length of a whole multiple of a named plot
  // quantum, or of two of them added.  The list is ordered largest-first so ties
  // go to the bigger quantum (2300 reads "1CP", never "2.1HC").  Returns null
  // when nothing divides the length, in which case the ruler prints the plain
  // number.  A half CP is a name of its own — see halfCpLabel.
  var QUANTA = [[2300, "CP"], [1200, "F"], [1100, "H"], [400, "S"]];
  var FRAC_MIN = 800;      // fractions only at or above this length
  var MAX_COEF = 12;       // largest coefficient any form may carry

  // Every term m x Q with m a whole multiple.  Cost is the coefficient: how many
  // of that building the length measures.
  function quantTerms(v) {
    var list = [], i, k;
    for (i = 0; i < QUANTA.length; i++) {
      var Q = QUANTA[i][0], name = QUANTA[i][1];
      var kMax = Math.min(MAX_COEF, Math.floor((v + 1e-6) / Q));
      for (k = 1; k <= kMax; k++) {
        list.push({ val: k * Q, cost: k, coef: k, text: k + name });
      }
    }
    return list;
  }

  // Cheapest way to write v as one term or as the sum of two.
  function bestForm(v) {
    var list = quantTerms(v), i, j;
    var single = null, best = null;
    for (i = 0; i < list.length; i++) {
      if (Math.abs(list[i].val - v) > 1e-6) { continue; }
      if (!single || list[i].cost < single.cost) { single = list[i]; }
    }
    for (i = 0; i < list.length; i++) {
      for (j = i; j < list.length; j++) {
        if (Math.abs(list[i].val + list[j].val - v) > 1e-6) { continue; }
        var a = list[i].val >= list[j].val ? list[i] : list[j];
        var b = list[i].val >= list[j].val ? list[j] : list[i];
        var cost = a.cost + b.cost;
        var text = a.text + b.text;
        var fits = !best || cost < best.cost ||
          (cost === best.cost && a.val > best.first + 1e-9) ||
          (cost === best.cost && Math.abs(a.val - best.first) < 1e-9 && text.length < best.text.length);
        if (fits) {
          best = { cost: cost, first: a.val, text: text, terms: 2,
                   maxCoef: Math.max(a.coef, b.coef) };
        }
      }
    }
    if (single && (!best || single.cost <= best.cost)) {
      return { text: single.text, cost: single.cost, terms: 1, maxCoef: single.coef };
    }
    return best;
  }

  // Pass 1 - whole quanta only, up to two terms.
  function cleanLabel(v) {
    var f = bestForm(v);
    return f ? f.text : null;
  }

  // Pass 1.5 - half a corpse pit is a name of its own: 1150 = 0.5CP,
  // 3450 = 1.5CP, 5750 = 2.5CP, 8050 = 3.5CP ...  The CP is the page's base
  // unit, so the odd half-multiples of it are worth naming (the triangle preset
  // legs are 5750 and 3450).  Even multiples are whole CP and pass 1 already
  // owns them, and halves of F/H/S are NOT named: 1400 would then read "3.5S"
  // instead of the "1/2 of 2F1S" it gets today.  No right-angle gate - this is
  // a length identity, not a fraction of a combination, so it holds on a wedge
  // too (which is why the triangle presets can print it).
  function halfCpLabel(v) {
    var k = v / (QUANTA[0][0] / 2);        // measured in half-CP units
    var m = Math.round(k);
    if (m < 1 || m > 2 * MAX_COEF || (m % 2) === 0) { return null; }
    if (Math.abs(k - m) > 1e-6) { return null; }
    return (m / 2).toFixed(1) + QUANTA[0][1];
  }

  // Pass 2 - the fraction covers the WHOLE combination: "1/2 of (2 CP)",
  // "1/4 of (3 FW)".  The bracket must itself be whole quanta, so a fractional
  // term can never be mixed with a whole one.
  function fracLabel(v) {
    var best = null, n, inner, cand;
    for (n = 2; n <= 4; n++) {
      inner = bestForm(v * n);
      if (!inner || inner.maxCoef > MAX_COEF) { continue; }
      cand = { n: n, text: "1/" + n + " of " + inner.text, terms: inner.terms };
      var fits = !best || cand.terms < best.terms ||
        (cand.terms === best.terms && cand.n < best.n) ||
        (cand.terms === best.terms && cand.n === best.n && cand.text.length < best.text.length);
      if (fits) { best = cand; }
    }
    return best ? best.text : null;
  }

  function quantumLabel(v, allowFrac) {
    if (!(v > 0)) { return null; }
    // Least labour first, and a clean form (whole quanta) always wins: the inner
    // combination of a fraction still has to be built, so a fraction is only used
    // when no clean form exists at all.  The half-CP identity ranks between the
    // two: it is exact and needs no build, so it beats any fraction.
    var clean = cleanLabel(v);
    if (clean) { return clean; }
    var half = halfCpLabel(v);
    if (half) { return half; }
    if (!allowFrac || v < FRAC_MIN - 1e-6) { return null; }
    return fracLabel(v);
  }

  // Strict point-in-polygon: a point on an edge counts as OUTSIDE, since the
  // ruler is happy to elbow on a plot edge but not inside the plot.
  function insidePoly(pts, p) {
    var i, j, inside = false;
    for (i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      var a = pts[i], b = pts[j];
      var ex = b[0] - a[0], ey = b[1] - a[1];
      var len2 = ex * ex + ey * ey;
      if (len2 > 1e-9) {
        var t = ((p[0] - a[0]) * ex + (p[1] - a[1]) * ey) / len2;
        t = Math.max(0, Math.min(1, t));
        var ddx = p[0] - (a[0] + t * ex), ddy = p[1] - (a[1] + t * ey);
        if (ddx * ddx + ddy * ddy < 1e-6) { return false; }
      }
      if (((a[1] > p[1]) !== (b[1] > p[1])) &&
          (p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0])) {
        inside = !inside;
      }
    }
    return inside;
  }

  // Keep the address bar in step with the plot: ?c=x0,y0,x1,y1,x2,y2,x3,y3.
  // replaceState (not pushState) so dragging does not flood the history.
  function syncUrl() {
    var list = state.corners.slice(0, 4).map(function (p) {
      return fmtCoord(p[0]) + "," + fmtCoord(p[1]);
    }).join(",");
    var want = "?c=" + list;
    if (location.search === want && !location.hash) { return; }
    try { history.replaceState(null, "", want); } catch (e) { /* file:// */ }
  }

  // Text is counter-rotated inside the rotated map so every label stays at its
  // original screen orientation (plain labels upright, aligned labels keep
  // their own angle).  Existing rotate() angles are shifted, same anchor.
  function uprightText(html, c) {
    if (!c) { return html; }
    return html.replace(/<text\b([^>]*)>/g, function (m, attrs) {
      var tm = /\btransform="rotate\(([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\)"/.exec(attrs);
      if (tm) {
        return m.replace(tm[0], 'transform="rotate(' + (parseFloat(tm[1]) + c) + ' ' +
          tm[2] + ' ' + tm[3] + ')"');
      }
      var xm = /\bx="([-\d.]+)"/.exec(attrs);
      var ym = /\by="([-\d.]+)"/.exec(attrs);
      if (!xm || !ym) { return m; }
      return "<text" + attrs + " transform=\"rotate(" + c + " " + xm[1] + " " + ym[1] + ")\">";
    });
  }

  function render() {
    var r = compute();
    last = r;
    if (syncPreset) { syncPreset(); }
    syncUrl();
    var out = [];

    pendingGridLabels.length = 0;
    compassText.length = 0;
    if (state.show.grid) { out.push(gridLayer()); }

    out.push(poly(r.corners.concat([r.corners[0]]),
      { fill: "none", stroke: "var(--plot)", "stroke-width": 2.2 }));

    if (state.show.buildings) {
      // Pre-commit preview decal: the engine's A house is a 100x100 Plane
      // scaled 7x12 -> 700x1200 (FUN_144b769f0), sampling bluredFrame with
      // plain UV0 (full-bleed).  The polygon is the decal plane; the mask is
      // the texture's alpha, so what is drawn is the visible shaded frame.
      // The decal follows the preview A fit (`previewA`, whole border), not the
      // post-commit A-part clearance fit and not the extension facade fit.
      var aO = null, aD = null;
      if (r.aDecal) { aO = r.aDecal.origin; aD = r.aDecal.dir; }
      if (aO) {
        var aPrev = B.rectOutline(aO, aD, 600, 350);
        out.push("<defs>" + frameMask("frameA", aO, aD, 600, 350) + "</defs>");
        out.push(poly(aPrev,
          { fill: "var(--house)", "fill-opacity": 0.42, stroke: "none",
            mask: "url(#frameA)" }));
        if (state.show.labels) { out.push(labelAt(aPrev, "A", "#5b7290", 14)); }
      }
    }

    if (state.show.buildings && r.secondary) {
      // B preview decal: the same bluredFrame, full-bleed, on a 4x8 plane
      // (400x800).  The fit c0 is the clearance-box origin; the caller's
      // pivot correction is not modelled yet.
      // The B decal sits at the spawn origin (fit c0 + half-mesh shift), not the
      // raw clearance-box centre.  With pivot 0 these coincide.
      var bO = r.secondary.origin, bD = r.secondary.dir;
      var bPrev = B.rectOutline(bO, bD, 400, 200);
      out.push("<defs>" + frameMask("frameB", bO, bD, 400, 200) + "</defs>");
      out.push(poly(bPrev,
        { fill: "var(--house)", "fill-opacity": 0.42, stroke: "none",
          mask: "url(#frameB)" }));
      out.push(poly([[r.secondary.origin[0] - 2, r.secondary.origin[1] - 2],
                     [r.secondary.origin[0] + 2, r.secondary.origin[1] - 2],
                     [r.secondary.origin[0] + 2, r.secondary.origin[1] + 2],
                     [r.secondary.origin[0] - 2, r.secondary.origin[1] + 2]],
        { fill: "var(--house)", stroke: "none" }));
      if (state.show.labels) { out.push(labelAt(bPrev, "B", "#5b7290", 13)); }
    }

    if (r.beds && r.beds.ok && state.show.zones) {
      ["bed1", "bed2", "bed3"].forEach(function (k, i) {
        var cols = ["var(--b1)", "var(--b2)", "var(--b3)"];
        var fills = ["#fee2e2", "#dcfce7", "#dbeafe"];
        out.push(poly(r.beds[k], { fill: fills[i], "fill-opacity": 0.85,
          stroke: cols[i], "stroke-width": 2 }));
        var p = r.beds[k];
        if (p && p.length > 2) {
          var c = [(p[0][0] + p[1][0] + p[2][0]) / 3, (p[0][1] + p[1][1] + p[2][1]) / 3];
          out.push(text(c, String(i + 1), cols[i], -3, 4, 12));
        }
      });
    }
    if (r.beds && r.beds.ok && r.beds.shed && state.show.zones) {
      out.push(poly(r.beds.shed, { fill: "#fef9c3", stroke: "var(--shed)",
        "stroke-width": 1.6, "stroke-dasharray": "4 3" }));
      out.push(text(r.beds.shed[0], "shed area", "#a16207", 5, 13, 10.5));
    }

    // The C0 -> C1 demarcation is drawn unconditionally and in exactly the same
    // format as the P0..P3 plot outline (same stroke, same width), so the
    // backyard boundary reads as part of the plot's own linework instead of a
    // Labels-layer annotation.  It sits above the ground layers (decals, beds)
    // so it stays readable with Backyard Zones on - bed 1 overlaps this line by
    // the engine's +150 shift - and below the plants.
    // Every cut body starts its ring on that edge: a normal cut is C0->C1, and
    // a corner cut keeps H1->H2 as its first edge, so ring[0]->ring[1] is the cut.
    if (r.fit.ok) {
      var cutRing = (r.fit.profile && r.fit.profile.length > 1) ? r.fit.profile : r.fit.quad;
      if (cutRing && cutRing.length > 1) {
        out.push(poly([cutRing[0], cutRing[1]],
          { fill: "none", stroke: "var(--plot)", "stroke-width": 2.2 }));
      }
    }
    // The extension cutter frame, shared by the plant label cells and the shed spot:
    // e1 = (uy,-ux), e2 = (ux,uy) from P1->P2, so both share the extension's rotation.
    var cellFrame = function () {
      var u = B.unit2(r.fit.quad[2][0] - r.fit.quad[1][0],
                      r.fit.quad[2][1] - r.fit.quad[1][1]);
      // Text follows the square: screen direction of e2 is (-e2y, e2x).
      var rot = Math.atan2(u[0], -u[1]) * 180 / Math.PI;
      if (rot > 90) { rot -= 180; }
      if (rot <= -90) { rot += 180; }
      return { e1x: u[1], e1y: -u[0], e2x: u[0], e2y: u[1], rot: rot };
    };
    var cellSquare = function (c, fr, hs) {
      return [
        [c[0] + hs * (fr.e1x + fr.e2x), c[1] + hs * (fr.e1y + fr.e2y)],
        [c[0] + hs * (-fr.e1x + fr.e2x), c[1] + hs * (-fr.e1y + fr.e2y)],
        [c[0] + hs * (-fr.e1x - fr.e2x), c[1] + hs * (-fr.e1y - fr.e2y)],
        [c[0] + hs * (fr.e1x - fr.e2x), c[1] + hs * (fr.e1y - fr.e2y)]
      ];
    };

    if (r.plants && r.plants.count && state.show.plants) {
      var dots = [];
      if (state.show.plabels) {
        // Labels on: a 100-unit cell square per spot, in the extension cutter's
        // frame (e1 = (uy,-ux), e2 = (ux,uy) from P1->P2), plus the 1-based
        // spot number (index + 1), the same numbering the Coordinates card uses.
        var rotDeg = 0;
        if (r.fit.ok) {
          var fr = cellFrame();
          rotDeg = fr.rot;
          var d = [];
          for (var ci = 0; ci < r.plants.points.length; ci++) {
            var q0 = r.plants.points[ci];
            var qc = cellSquare(q0, fr, 50.0);
            d.push("M" + sx(qc[0]).toFixed(1) + " " + sy(qc[0]).toFixed(1) +
                   "L" + sx(qc[1]).toFixed(1) + " " + sy(qc[1]).toFixed(1) +
                   "L" + sx(qc[2]).toFixed(1) + " " + sy(qc[2]).toFixed(1) +
                   "L" + sx(qc[3]).toFixed(1) + " " + sy(qc[3]).toFixed(1) + "Z");
          }
          out.push("<path d=\"" + d.join("") + "\" fill=\"none\" stroke=\"var(--plant)\"" +
            " stroke-opacity=\".3\" stroke-width=\"0.8\"/>");
        }
        for (var pi = 0; pi < r.plants.points.length; pi++) {
          var pp = r.plants.points[pi];
          var tx = sx(pp).toFixed(1), ty = sy(pp).toFixed(1);
          dots.push("<text x=\"" + tx + "\" y=\"" + ty + "\" transform=\"rotate(" +
            rotDeg.toFixed(2) + " " + tx + " " + ty + ")\"" +
            " text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"plabel\">" +
            (pi + 1) + "</text>");
        }
      } else {
        for (var pj = 0; pj < r.plants.points.length; pj++) {
          var pq = r.plants.points[pj];
          dots.push("<circle cx=\"" + sx(pq).toFixed(1) + "\" cy=\"" + sy(pq).toFixed(1) +
            "\" r=\"1.7\" fill=\"var(--plant)\" fill-opacity=\".65\"/>");
        }
      }
      out.push("<g>" + dots.join("") + "</g>");
    }

    // Shed spot last of the two so it paints OVER the plant spots (layer priority),
    // matching its role as a building rather than a plant.
    if (r.shed && state.show.buildings) {
      // The shed reads as one plant spot: the same 100-unit cell square at the
      // shed-mesh centre, with the letter S instead of a spot number.
      var sfr = cellFrame();
      var sCell = cellSquare(r.shed.origin, sfr, 50.0);
      out.push(poly(sCell.concat([sCell[0]]),
        { fill: "none", stroke: "var(--plant)", "stroke-opacity": ".3",
          "stroke-width": 0.8 }));
      var stx = sx(r.shed.origin).toFixed(1), sty = sy(r.shed.origin).toFixed(1);
      out.push("<text x=\"" + stx + "\" y=\"" + sty + "\" transform=\"rotate(" +
        sfr.rot.toFixed(2) + " " + stx + " " + sty + ")\"" +
        " text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"plabel\">S</text>");
    }

    if (r.fit.ok && state.show.labels) {
      // The engine's extension polygon is `profile` (outPolyB / SmoothBorder), not the
      // 4-point corner list: an AB+BC corner cut keeps the rest of the plot and the
      // polygon runs ...P3 -> P0 -> H1.  Straight-side resample points are collinear,
      // so for a normal cut this draws the same quad as before.
      var ring = (r.fit.profile && r.fit.profile.length > 3) ? r.fit.profile : r.fit.quad;
      out.push(poly(ring.concat([ring[0]]),
        { fill: "none", stroke: "var(--quad)", "stroke-width": 2.6 }));
      var placed = [];
      ["C0", "C1", "C2", "C3"].forEach(function (lab, i) {
        var p = r.fit.quad[i];
        if (!p) { return; }
        for (var j = 0; j < placed.length; j++) {
          if (Math.hypot(p[0] - placed[j][0], p[1] - placed[j][1]) < 0.5) { return; }
        }
        placed.push(p);
        out.push(text(p, lab, "var(--quad)", 5, i < 2 ? -8 : 15, 12));
      });
    }

    if (state.show.dbg && r.fit.ok) {
      var tr = r.fit.trace;
      if (tr.origin && tr.dir) {
        out.push("<circle cx=\"" + sx(tr.origin).toFixed(1) + "\" cy=\"" +
          sy(tr.origin).toFixed(1) + "\" r=\"3\" fill=\"var(--dbg)\"/>");
      }
      if (tr.Q) {
        out.push("<circle cx=\"" + sx(tr.Q).toFixed(1) + "\" cy=\"" + sy(tr.Q).toFixed(1) +
          "\" r=\"4\" fill=\"var(--dbg)\"/>" + text(tr.Q, "Q", "var(--dbg)", 6, -6, 11));
      }
      if (tr.A0) {
        out.push("<circle cx=\"" + sx(tr.A0).toFixed(1) + "\" cy=\"" + sy(tr.A0).toFixed(1) +
          "\" r=\"4\" fill=\"none\" stroke=\"var(--dbg)\" stroke-width=\"2\"/>" +
          text(tr.A0, "A0", "var(--dbg)", 6, 13, 11));
      }
    }

    // Ruler visibility: a plain two-state switch, always-on by default.  Edge
    // Mode has no plot corners to measure against, so it is off there entirely.
    var showRuler = state.manual && state.ruler;

    for (var i = 0; i < 4; i++) {
      // Manual mode owns the handles; with it off the corners are set by the
      // Plot Control sliders, so no grab targets are drawn at all.  A locked
      // P0 is pinned to the origin and has no handle until it is released.
      if (state.manual && (i !== 0 || !state.lock0)) { out.push(handle(r.corners[i], i)); }
      // Point labels normally belong to the Labels layer, but while the ruler is
      // showing they are drawn too so the legs can be read against them.
      if (state.show.labels || showRuler) { out.push(cornerLabel(r.corners[i], i)); }
    }

    // Ruler: two dimension bands outside the plot.  Pairs are measured, then the
    // spans are reduced to an ADJACENT CHAIN per axis: on x = 0, 400, 3400, 4600
    // keep 400 + 3000 + 1200 and drop 3400, 4200 and 4600, which are sums of
    // those.  No redundant row, no line crossing the shape.
    if (showRuler) {
      var rg = rulerGeom();
      var yBase = rg.b.maxy + rg.pad;      // DX rows, marching left on screen
      var xBase = rg.b.maxx + rg.pad;      // DY rows, marching down the screen
      var i2, j2;
      var fracOk = (function (c) {
        for (var ci2 = 0; ci2 < 2; ci2++) {
          var A = c[ci2], B = c[(ci2 + 1) % 4], D = c[(ci2 + 3) % 4];
          var ux = B[0] - A[0], uy = B[1] - A[1];
          var wx = D[0] - A[0], wy = D[1] - A[1];
          var lu = Math.hypot(ux, uy), lw = Math.hypot(wx, wy);
          if (lu < 1e-6 || lw < 1e-6) { return false; }
          if (Math.abs(ux * wx + uy * wy) > 1e-9 * lu * lw) { return false; }
        }
        return true;
      })(r.corners);

      // Every pair's component span, per axis.  Spans between ADJACENT corners
      // are real edges of the plot, so they are always kept even when they are
      // the sum of chain spans (the frontage must be readable as one number).
      var spansX = [], spansY = [];
      var adjacent = function (a, b) {
        var lo = Math.min(a, b), hi = Math.max(a, b);
        return (lo === 0 && hi === 1) || (lo === 1 && hi === 2) ||
               (lo === 2 && hi === 3) || (lo === 0 && hi === 3);
      };
      for (i2 = 0; i2 < 4; i2++) {
        for (j2 = i2 + 1; j2 < 4; j2++) {
          var cA = state.corners[i2], cB = state.corners[j2];
          var isEdge = adjacent(i2, j2);
          if (Math.abs(cB[0] - cA[0]) > 0.5) {
            spansX.push({ lo: Math.min(cA[0], cB[0]), hi: Math.max(cA[0], cB[0]), edge: isEdge });
          }
          if (Math.abs(cB[1] - cA[1]) > 0.5) {
            spansY.push({ lo: Math.min(cA[1], cB[1]), hi: Math.max(cA[1], cB[1]), edge: isEdge });
          }
        }
      }
      var axisKey = function (lo, hi) { return Math.round(lo * 10) + ":" + Math.round(hi * 10); };
      // Keep spans between neighbouring coordinates (the chain) plus every edge
      // span; anything else is a sum of kept dimensions.
      var chain = function (list) {
        if (!list.length) { return []; }
        var vals = [], i;
        for (i = 0; i < list.length; i++) { vals.push(list[i].lo, list[i].hi); }
        vals.sort(function (a, b) { return a - b; });
        var uniq = [];
        for (i = 0; i < vals.length; i++) {
          if (!uniq.length || Math.abs(uniq[uniq.length - 1] - vals[i]) > 0.5) { uniq.push(vals[i]); }
        }
        var chainKeys = {};
        for (i = 0; i + 1 < uniq.length; i++) { chainKeys[axisKey(uniq[i], uniq[i + 1])] = 1; }
        var res = [], seen = {}, k;
        for (i = 0; i < list.length; i++) {
          k = axisKey(list[i].lo, list[i].hi);
          if (seen[k]) { continue; }
          if (!list[i].edge && !chainKeys[k]) { continue; }
          seen[k] = 1;
          res.push(list[i]);
        }
        res.sort(function (a, b) { return a.lo - b.lo; });
        return res;
      };
      var rowX = chain(spansX), rowY = chain(spansY);

      var extLine = function (ax, ay, bx2, by2) {
        // Clip the run where it leaves the shape, so no extension line crosses
        // the interior; its x/y still identifies the corner.
        var K2 = 60, k2, lastIn = -1;
        for (k2 = 1; k2 < K2; k2++) {
          var tt = k2 / K2;
          if (insidePoly(r.corners, [ax + (bx2 - ax) * tt, ay + (by2 - ay) * tt])) { lastIn = tt; }
        }
        // Overshoot by 1.5 samples so the start sits clearly outside: a single
        // sample can still land inside and leave a stub crossing the edge.
        var t0 = lastIn < 0 ? 0 : lastIn + 1.5 / K2;
        var sx0 = ax + (bx2 - ax) * t0, sy0 = ay + (by2 - ay) * t0;
        out.push("<line x1=\"" + sx([sx0, sy0, 0]).toFixed(1) + "\" y1=\"" + sy([sx0, sy0, 0]).toFixed(1) +
          "\" x2=\"" + sx([bx2, by2, 0]).toFixed(1) + "\" y2=\"" + sy([bx2, by2, 0]).toFixed(1) +
          "\" stroke=\"#dc2626\" stroke-width=\"0.8\" stroke-opacity=\".5\"/>");
      };
      var tickAt = function (wx, wy, alongX) {
        var tx = sx([wx, wy, 0]), ty = sy([wx, wy, 0]);
        out.push("<line x1=\"" + (tx + (alongX ? -4.5 : 0)).toFixed(1) +
          "\" y1=\"" + (ty + (alongX ? 0 : -4.5)).toFixed(1) +
          "\" x2=\"" + (tx + (alongX ? 4.5 : 0)).toFixed(1) +
          "\" y2=\"" + (ty + (alongX ? 0 : 4.5)).toFixed(1) +
          "\" stroke=\"#dc2626\" stroke-width=\"1.4\"/>");
      };
      var dimLine = function (ax, ay, bx2, by2) {
        out.push("<line x1=\"" + sx([ax, ay, 0]).toFixed(1) + "\" y1=\"" + sy([ax, ay, 0]).toFixed(1) +
          "\" x2=\"" + sx([bx2, by2, 0]).toFixed(1) + "\" y2=\"" + sy([bx2, by2, 0]).toFixed(1) +
          "\" stroke=\"#dc2626\" stroke-width=\"1.6\" stroke-dasharray=\"2 3\" stroke-linecap=\"round\"/>");
      };
      // A corner sitting on the given coordinate, for the extension lines.
      var cornerAt = function (axis, v) {
        for (var q2 = 0; q2 < 4; q2++) {
          var val = axis === "x" ? state.corners[q2][0] : state.corners[q2][1];
          if (Math.abs(val - v) < 0.5) { return state.corners[q2]; }
        }
        return null;
      };

      // Pack the rows: shortest dimension first (nearest the plot), and two
      // spans may share a row when they do not touch along that axis.
      var packRows = function (list, gap) {
        var order = list.slice().sort(function (a, b) { return (a.hi - a.lo) - (b.hi - b.lo); });
        var rows = [], i, r, j;
        for (i = 0; i < order.length; i++) {
          var sp = order[i], placed = false;
          for (r = 0; r < rows.length && !placed; r++) {
            var clash = false;
            for (j = 0; j < rows[r].length; j++) {
              var q = rows[r][j];
              // Touching is fine; only a positive overlap along the axis clashes.
              if (Math.min(q.hi, sp.hi) - Math.max(q.lo, sp.lo) > 0) { clash = true; break; }
            }
            if (!clash) { rows[r].push(sp); placed = true; }
          }
          if (!placed) { rows.push([sp]); }
        }
        return rows;
      };
      var bandSpan = Math.max(rg.b.maxx - rg.b.minx, rg.b.maxy - rg.b.miny, 900);
      var rowsX = packRows(rowX, 0.03 * bandSpan);
      var rowsY = packRows(rowY, 0.03 * bandSpan);

      var ri, rk, row, yRow, xRow, pA2, pB2, span, q2b;
      for (ri = 0; ri < rowsX.length; ri++) {
        for (rk = 0; rk < rowsX[ri].length; rk++) {
        row = rowsX[ri][rk];
        yRow = yBase + ri * rg.step;
        pA2 = cornerAt("x", row.lo);
        pB2 = cornerAt("x", row.hi);
        if (!pA2 || !pB2) { continue; }
        extLine(pA2[0], pA2[1], pA2[0], yRow);
        extLine(pB2[0], pB2[1], pB2[0], yRow);
        dimLine(row.lo, yRow, row.hi, yRow);
        tickAt(row.lo, yRow, true);
        tickAt(row.hi, yRow, true);
        span = row.hi - row.lo;
        q2b = quantumLabel(span, fracOk);
        out.push(textRot([(row.lo + row.hi) / 2, yRow, 0],
          fmtCoord(span) + (q2b ? " or " + q2b : ""), "#334155", 0, 0, 10.5, -90));
        }
      }
      for (ri = 0; ri < rowsY.length; ri++) {
        for (rk = 0; rk < rowsY[ri].length; rk++) {
        row = rowsY[ri][rk];
        xRow = xBase + ri * rg.step;
        pA2 = cornerAt("y", row.lo);
        pB2 = cornerAt("y", row.hi);
        if (!pA2 || !pB2) { continue; }
        extLine(pA2[0], pA2[1], xRow, pA2[1]);
        extLine(pB2[0], pB2[1], xRow, pB2[1]);
        dimLine(xRow, row.lo, xRow, row.hi);
        tickAt(xRow, row.lo, false);
        tickAt(xRow, row.hi, false);
        span = row.hi - row.lo;
        q2b = quantumLabel(span, fracOk);
        out.push(textRot([xRow, (row.lo + row.hi) / 2, 0],
          fmtCoord(span) + (q2b ? " or " + q2b : ""), "#334155", 0, 0, 10.5, 0));
        }
      }
    }
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    if (state.autozoom) {
      svg.style.width = "100%"; svg.style.height = "100%"; svg.style.flex = "1 1 auto";
    } else {
      svg.style.width = W + "px"; svg.style.height = H + "px"; svg.style.flex = "0 0 auto";
    }
    // Grid numbers and the compass words live outside the rotated group so their
    // anchors stay put on screen; everything else rotates as one.
    var gridTxt = (state.show.grid) ? (gridLabels() + compassLabelsSvg()) : "";
    if (state.rot) {
      // The whole drawing is one transform: rotate the map about the canvas
      // centre, 90 deg CCW per click.  Model maths stay in world space; the
      // text inside is counter-rotated so it never turns sideways.
      svg.innerHTML = "<g transform=\"rotate(" + (-90 * state.rot) + " " +
        (W / 2).toFixed(1) + " " + (H / 2).toFixed(1) + ")\">" +
        uprightText(out.join(""), 90 * state.rot) + "</g>" + gridTxt;
    } else {
      svg.innerHTML = out.join("") + gridTxt;
    }
    updateStatus(r);
  }

  function fmt(v, n) { return v.toFixed(n === undefined ? 0 : n); }
  // Player-facing explanation for a missing backyard extension.  The model's
  // reasons ("back facade", "border crossings", "fitter", "box") mean nothing
  // to someone using the page, so map them onto Plot Control terms.
  function extFailKind(reason) {
    var r = String(reason || "");
    if (/too small for backyard/i.test(r)) { return "tooSmall"; }
    if (/border crossing/i.test(r)) { return "tooLong"; }
    if (/A dropped|no house fit|A fit|no candidate|side extraction/i.test(r)) { return "noRoom"; }
    if (/degenerate/i.test(r)) { return "collapsed"; }
    if (/cut|slice|abort/i.test(r)) { return "noDivide"; }
    return "other";
  }
  function extFailShort(reason) {
    switch (extFailKind(reason)) {
      case "tooSmall": return "Plot too small for backyard extension.";
      case "tooLong": return "Frontage too long for the cut line";
      case "noRoom": return "no room for house + backyard";
      case "collapsed": return "a side has collapsed";
      case "noDivide": return "shape does not divide cleanly";
      default: return "could not be fitted";
    }
  }
  function extFailText(reason) {
    switch (extFailKind(reason)) {
      case "tooSmall":
        return "Plot too small for backyard extension.";
      case "tooLong":
        return "the plot is too wide for the game's backyard cut \u2014 the facade line only " +
          "reaches 10,000 u (100 m) out from the house. Shorten the Frontage, or move a " +
          "corner in.";
      case "noRoom":
        return "there is not enough room for a house and a backyard at this shape. " +
          "Widen the Frontage, lengthen the Length, or move a corner.";
      case "collapsed":
        return "one of the sides has collapsed. Give every side some length with the " +
          "Frontage and Length sliders, or pick a preset.";
      case "noDivide":
        return "the backyard does not divide cleanly at this shape. Nudge a corner, or try a preset.";
      default:
        return "the backyard could not be fitted at this shape. Adjust Frontage or Length, " +
          "or move a corner.";
    }
  }
  function kv(k, v) {
    return "<div class=\"kv\"><span>" + k + "</span><span>" + v + "</span></div>";
  }

  function updateStatus(r) {
    var el = document.getElementById("status");
    var banner = document.getElementById("banner");
    // One place that shows/hides the banner, so the green "note" styling can
    // never leak from the 0-bed case into a real error (and vice versa).
    function showBanner(text, kind) {
      banner.textContent = text;
      if (kind === "note") { banner.classList.add("note"); }
      else { banner.classList.remove("note"); }
      banner.classList.add("on");
    }
    function hideBanner() {
      banner.classList.remove("on");
      banner.classList.remove("note");
    }
    var rows = [];
    var cls = "";
    var sec = function (t) { return "<div class=\"sec\">" + t + "</div>"; };
    var setLayer = function (id, on, txt) {
      var e = document.getElementById(id);
      if (!e) { return; }
      e.className = "ly-state " + (on ? "on" : "off");
      e.textContent = txt;
    };
    (function () {
      ["st-zones", "st-buildings"].forEach(function (id) {
        var e = document.getElementById(id);
        if (e) { e.className = "ly-state"; e.textContent = "\u2014"; }
      });
    })();

    // Areas are needed by the Plants section (density) as well as by Plot.
    var shoelace = function (pts) {
      if (!pts || pts.length < 3) { return null; }
      var a = 0;
      for (var si = 0; si < pts.length; si++) {
        var sq = pts[(si + 1) % pts.length];
        a += pts[si][0] * sq[1] - sq[0] * pts[si][1];
      }
      return Math.abs(a) / 2;
    };
    var plotArea = shoelace(r.corners);
    // Extension area = the engine polygon (SmoothBorder / outPolyB), not the 4 corners.
    // They coincide on a normal cut (resample points are collinear) but an AB+BC corner
    // cut keeps P0, which the 4-point list omits.  Plant density uses this, not the plot.
    var extArea = (r.fit && r.fit.ok)
      ? shoelace((r.fit.profile && r.fit.profile.length > 3) ? r.fit.profile : r.fit.quad)
      : null;

    if (r.plants) {
      rows.push(sec("Plants"));
      rows.push(kv("N plants", r.plants.count));
      // Plant Density = N / PLOT area (the whole burgage plot, not just the
      // backyard), in the same unit the area cells use.
      if (r.plants && plotArea !== null) {
        var du = AREA_UNITS[areaUnit];
        var dv = r.plants.count / (plotArea / du.div);
        var dtxt = (du.id === "uu") ? dv.toExponential(2) : String(Math.round(dv));
        var dtip = "Plant Density is N plants divided by the plot area, expressed per " +
                   "the selected area unit. The unit follows the plot area and extension " +
                   "area selector (" + du.name + ").";
        rows.push("<div class=\"kv\"><span class=\"hint\" title=\"" + dtip + "\">Plant Density</span>" +
                  "<span title=\"" + dtip + "\">" + dtxt + " /" + du.name + "</span></div>");
      }
      if (r.plantsAt && r.plantsAt[0] !== null && r.plantsAt[1] !== null) {
        var nlo = r.plantsAt[0], nhi = r.plantsAt[1], nn = r.plants.count;
        var pct = function (v) {
          var q = Math.round((v - nn) / nn * 100);
          return (q > 0 ? "+" : "") + q;
        };
        var tip = "Pseudorandom range for N plants depending on position of plot on world " +
                  "map (x,y) (" + pct(nlo) + "%," + pct(nhi) + "%).";
        rows.push("<div class=\"kv\"><span class=\"hint\" title=\"" + tip + "\">N Range</span>" +
                  "<span title=\"" + tip + "\">" + nlo + " to " + nhi + "</span></div>");
      } else if (r.plants && r.plants.count) {
        // No bed records -> the raster is frac-independent, so there is no range.
        var etip = "No bed records: the plant raster does not depend on frac, so the " +
                   "count is exact.";
        rows.push("<div class=\"kv\"><span class=\"hint\" title=\"" + etip + "\">N Range</span>" +
                  "<span title=\"" + etip + "\">Exact</span></div>");
      }
      if (r.plants.count && r.shed && r.shed.box && r.shed.box.length) {
        var scx = 0, scy = 0, bi;
        for (bi = 0; bi < r.shed.box.length; bi++) {
          scx += r.shed.box[bi][0]; scy += r.shed.box[bi][1];
        }
        scx /= r.shed.box.length; scy /= r.shed.box.length;
        var dsum = 0;
        for (bi = 0; bi < r.plants.points.length; bi++) {
          dsum += Math.hypot(r.plants.points[bi][0] - scx, r.plants.points[bi][1] - scy);
        }
        var atip = "Average plant distance to the shed." + (r.shedStandIn
          ? " This plot has no bed records, so the engine spawns no shed; the " +
            "reference point is house A (stand-in)."
          : "");
        rows.push("<div class=\"kv\"><span class=\"hint\" title=\"" + atip +
          "\">Avg distance</span><span>" + fmt(dsum / r.plants.points.length, 0) + "</span></div>");
      }
    }

    // ------------------------------------------------------------- costs
    // GetExtensionAreaCostMultiplier / GetRegionalWealthCostForUpgrade:
    // max(1.0, floor(area / 3,500,000 * 10 + 0.5) / 10).  It heads the Costs
    // section now (it used to be the first Plot row) and also scales seeds.
    var extCost = function (a) {
      if (a === null || a === undefined) { return null; }
      return Math.max(1.0, Math.floor(a / EXT_COST_BASE * 10 + 0.5) / 10);
    };
    var extMod = extCost(extArea);
    rows.push(sec("Costs"));
    rows.push("<div class=\"kv\"><span class=\"hint\" title=\"" +
      "Regional wealth cost of the upgrade is multiplied by this: +10% per 350,000 uu of " +
      "extension area above 3,675,000 uu (base 3,500,000 uu = DefaultExtensionLength 3500 " +
      "x DefaultExtensionWidth 1000). Clamped at 1.0, so smaller extensions get no " +
      "discount.\">Ext Cost Modifier</span><span>" +
      (extMod === null ? "\u2014" : "+" + Math.round((extMod - 1) * 100) + "%") + "</span></div>");
    // Seed Cost: base prices 20 / 32 / 48, each with the current additive
    // percentage modifiers folded in -- the Ext Cost Modifier is that sum
    // (+X% = 1 + X/100), so the price is base * extMod, rounded to a whole
    // regional-wealth point.  Each value carries the crop name as its tooltip
    // and the dotted underline the area cells use, so the hover is discoverable.
    var SEEDS = [[20, "Beetroots", "#7c3aed"], [32, "Carrots", "#ea580c"],
                 [48, "Cabbages", "#15803d"]];
    var seedHtml = SEEDS.map(function (s) {
      var v = (extMod === null) ? "\u2014" : String(Math.round(s[0] * extMod));
      return "<span class=\"hint\" title=\"" + s[1] + "\" style=\"color:" + s[2] + "\">" + v + "</span>";
    }).join(", ");
    rows.push("<div class=\"kv\"><span class=\"hint\" title=\"" +
      "Seed prices in regional wealth: Beetroots 20, Carrots 32, Cabbages 48, each with the " +
      "additive percentage modifiers folded in (the Ext Cost Modifier).\">Seed Cost (RW)</span><span>" +
      seedHtml + "</span></div>");
    // Plants per RW: one ratio per crop — N plants divided by that crop's seed
    // price in regional wealth (the rounded prices shown in the row above).
    if (extMod !== null && r.plants && r.plants.count) {
      var prHtml = SEEDS.map(function (s) {
        var price = Math.round(s[0] * extMod);
        var v = (price > 0) ? (r.plants.count / price).toFixed(2) : "\u2014";
        return "<span class=\"hint\" title=\"" + s[1] +
          " - N plants per point of regional wealth spent on this seed\" style=\"color:" +
          s[2] + "\">" + v + "</span>";
      }).join(", ");
      var prTip = "N plants divided by each crop's seed price in regional wealth " +
        "(Beetroots, Carrots, Cabbages - left to right).";
      rows.push("<div class=\"kv\"><span class=\"hint\" title=\"" + prTip +
        "\">Plants per RW</span><span>" + prHtml + "</span></div>");
    }

    rows.push(sec("Plot"));

    // extArea was computed above (the Plants density uses it).

    var areaCell = function (a) {
      if (a === null || a === undefined) { return "\u2014"; }
      var u = AREA_UNITS[areaUnit];
      return "<span class=\"unitpick\" title=\"" + u.tip + "\">" + u.text(a) + "</span>";
    };
    rows.push(kv("plot area", areaCell(plotArea)));
    rows.push(kv("extension area", areaCell(extArea)));

    // P0..P3 always listed (debug readout).  Same 1-decimal values as ?c= in the
    // URL, so the panel and the address bar cannot disagree.
    for (var ci = 0; ci < 4; ci++) {
      var cp = r.corners[ci];
      rows.push("<div class=\"kv\"><span>P" + ci + "</span><span>" +
        fmtCoord(cp[0]) + ", " + fmtCoord(cp[1]) + "</span></div>");
    }
    for (var ei = 0; ei < 4; ei++) {
      var ea = r.corners[ei], eb = r.corners[(ei + 1) % 4];
      rows.push(kv("P" + ei + "\u2192P" + ((ei + 1) % 4),
        fmt(Math.hypot(eb[0] - ea[0], eb[1] - ea[1]))));
    }

    if (r.wind >= 0) {
      cls = "err";
      showBanner("P0\u2013P3 are running the wrong way round. The engine only ever " +
        "stores plots with a negative signed area \u2014 in UE5 (left-handed, map Y " +
        "increasing downward) that reads counter-clockwise on screen. Drag a corner back " +
        "across the plot until the order matches.");
      el.className = cls;
      el.innerHTML = rows.join("");
      return;
    }

    rows.push(sec("Primary House"));
    rows.push(kv("fit position", r.aDecal ? fmt(r.aDecal.arc) : "none"));

    rows.push(sec("Secondary House"));
    rows.push(kv("fit position", r.secondary ? fmt(r.secondary.origin[0]) : "none"));

    rows.push(sec("Extension"));
    if (!r.fit.ok) {
      cls = "err";
      rows.push(kv("backyard", "none on this plot shape"));
      rows.push(kv("why", extFailShort(r.fit.reason)));
      if (r.geomOk === false) {
        showBanner("This plot's corners cross each other (a bow-tie shape). " +
          "Move a corner until the outline no longer crosses itself.");
      } else {
        var failText = extFailText(r.fit.reason);
        showBanner((extFailKind(r.fit.reason) === "tooSmall")
          ? failText
          : "No backyard extension: " + failText);
      }
    } else {
      hideBanner();
      var P0 = r.corners[0], P1 = r.corners[1], Q0 = r.fit.quad[0], Q1 = r.fit.quad[1];
      var fx = P1[0] - P0[0], fy = P1[1] - P0[1];
      var fl = Math.sqrt(fx * fx + fy * fy);
      var depth = null;
      if (fl > 1e-9) {
        var nx = fy / fl, ny = -fx / fl;
        var d0 = (Q0[0] - P0[0]) * nx + (Q0[1] - P0[1]) * ny;
        var d1 = (Q1[0] - P0[0]) * nx + (Q1[1] - P0[1]) * ny;
        depth = Math.abs((d0 + d1) / 2);
      }
      rows.push(kv("cut depth", depth === null ? "\u2014" : fmt(depth)));
      rows.push(kv("Off House", (r.fit.trace && r.fit.trace.Q)
        ? fmt(r.fit.trace.Q[0]) + ", " + fmt(r.fit.trace.Q[1]) + " (" +
          ((r.fit.trace.boxSource) || "A") + ")"
        : "\u2014"));
    }

    if (r.beds) {
      if (r.beds.ok) {
        var area = function (p) {
          var a = 0;
          for (var i = 0; i < p.length; i++) {
            var q = p[(i + 1) % p.length];
            a += p[i][0] * q[1] - q[0] * p[i][1];
          }
          return Math.abs(a) / 2;
        };
        rows.push(sec("Beds"));
        rows.push(kv("areas", [r.beds.bed1, r.beds.bed2, r.beds.bed3]
          .map(function (p) { return fmt(area(p)); }).join(" / ")));
        rows.push(kv("shed", r.beds.shed ? fmt(area(r.beds.shed)) : "none"));
        rows.push(kv("shed mesh", r.shed
          ? fmt(r.shed.origin[0]) + ", " + fmt(r.shed.origin[1])
          : "none"));
        rows.push(kv("offset", fmt(r.beds.offset[0]) + ", " + fmt(r.beds.offset[1])));
      } else {
        // The engine's own 0-bed state, not a failure: updateSubfield breaks out
        // of the type-8 case right after cut 1, and the plants then rasterise
        // the whole extension.  Rendered green ("note"), never red.
        cls = "";
        rows.push("<div class=\"kv note\"><span>beds</span><span>No shed or planter " +
          "beds generated. Plants fill the whole extension.</span></div>");
        if (r.fit && r.fit.ok && r.shed) {
          // updateSubfield breaks out of the type-8 case before the shed spawn,
          // so the game has none; the page keeps a stand-in on house A.
          rows.push(kv("shed mesh", "at house A " + fmt(r.shed.origin[0]) + ", " +
            fmt(r.shed.origin[1]) + " (stand-in: no bed records)"));
        }
        showBanner("No shed or planter beds generated. Plants fill the whole extension.",
                   "note");
      }
    }
    setLayer("st-zones", !!(r.beds && r.beds.ok) || !!(r.beds && r.beds.shed),
             (r.beds && r.beds.ok) ? "present" : "none");
    var parts = [];
    if (r.aDecal) { parts.push("A"); }
    if (r.secondary) { parts.push("B"); }
    if (r.shed) { parts.push("shed"); }
    setLayer("st-buildings", parts.length > 0, parts.length ? parts.join(" + ") : "none");
    el.className = cls;
    el.innerHTML = rows.join("");
    // 800+ spot rows are cheap to build but expensive to lay out, so the list is
    // refreshed when the drag ends rather than on every pointer move.
    if (drag === null) { updateCoords(r); }
  }

  // ---------------------------------------------------------- coordinates
  function centroid(pts) {
    var cx = 0, cy = 0;
    for (var i = 0; i < pts.length; i++) { cx += pts[i][0]; cy += pts[i][1]; }
    return [cx / pts.length, cy / pts.length];
  }

  function updateCoords(r) {
    var out = [];
    if (r.aDecal) {
      // The A decal is a 700x1200 plane centred on the transform origin.
      // (A centroid over rectOutline would include its duplicated closing
      // vertex and shift the number by 1/5 of the half-diagonal.)
      out.push(kv("House", fmt(r.aDecal.origin[0], 1) + ", " + fmt(r.aDecal.origin[1], 1)));
    } else {
      out.push(kv("House", "none"));
    }
    if (r.shed) {
      var s = centroid(r.shed.box);
      out.push(kv("Shed", fmt(s[0], 1) + ", " + fmt(s[1], 1)));
    } else {
      out.push(kv("Shed", "none"));
    }
    if (r.plants && r.plants.count) {
      for (var i = 0; i < r.plants.count; i++) {
        var p = r.plants.points[i];
        out.push(kv("spot" + (i + 1), fmt(p[0], 1) + ", " + fmt(p[1], 1)));
      }

  }

  // ------------------------------------------------------------- interaction
  var drag = null;

  // Inverse of the view rotation: the drawing is inside a rotated <g>, so a
  // pointer in SVG units has to be un-rotated before mapping back to world.
  function unrotatePoint(qx, qy) {
    if (!state.rot) { return [qx, qy]; }
    var cx = W / 2, cy = H / 2, dx = qx - cx, dy = qy - cy;
    if (state.rot === 1) { return [cx - dy, cy + dx]; }
    if (state.rot === 2) { return [cx - dx, cy - dy]; }
    return [cx + dy, cy - dx];
  }

  function svgPoint(evt) {
    // Client -> SVG user units.  The SVG is 900x868 with
    // preserveAspectRatio="xMidYMid meet", so the picture is letterboxed inside
    // the element whenever its CSS aspect is not 900:620.  Mapping with
    // rect.width/rect.height ignores that padding, which is why a grabbed
    // handle jumped: near an edge the error is the whole letterbox bar.
    if (svg.createSVGPoint && svg.getScreenCTM) {
      var pt = svg.createSVGPoint();
      pt.x = evt.clientX;
      pt.y = evt.clientY;
      var ctm = svg.getScreenCTM();
      if (ctm) {
        var q = pt.matrixTransform(ctm.inverse());
        return unrotatePoint(q.x, q.y);
      }
    }
    var rect = svg.getBoundingClientRect();
    var s = Math.min(rect.width / W, rect.height / H);
    return unrotatePoint(
      W / 2 + (evt.clientX - rect.left - rect.width / 2) / s,
      H / 2 + (evt.clientY - rect.top - rect.height / 2) / s);
  }

  var dragOffset = null;   // corner minus pointer, so the grab does not snap

  svg.addEventListener("pointerdown", function (evt) {
    var g = evt.target.closest ? evt.target.closest(".handle") : null;
    if (!g) { return; }
    var i = parseInt(g.getAttribute("data-i"), 10);
    if (i === 0 && state.lock0) { return; }   // P0 is pinned to the origin
    if (!state.manual) { return; }      // Plot Control owns the dimensions
    drag = i;
    histDrag = histSnap();              // restore point for undo (pointerup)
    var sp = svgPoint(evt);
    var w = toWorld(sp[0], sp[1]);
    var c0 = state.corners[i];
    dragOffset = [c0[0] - w[0], c0[1] - w[1]];
    g.classList.add("drag");
    try { svg.setPointerCapture(evt.pointerId); } catch (e) { /* synthetic pointer */ }
    render();          // draw the drag aids immediately, not on the first move
    evt.preventDefault();
  });

  svg.addEventListener("pointermove", function (evt) {
    if (drag === null) { return; }
    var sp = svgPoint(evt);
    var w = toWorld(sp[0], sp[1]);
    // keep the point where it was grabbed: the hit circle is 18 units wide, so
    // clicking its edge would otherwise snap the corner onto the cursor
    w = [w[0] + dragOffset[0], w[1] + dragOffset[1]];
    // no drag limits: the corner follows the pointer wherever it goes
    if (drag === 1 && state.lock1) { w[1] = 0; }   // P1 stays on y = 0 (the street line)
    // Always land on whole units: the engine works in integer uu and a float
    // corner only produces unreadable coordinates and a 4599.999 ruler leg.
    w[0] = Math.round(w[0]);
    w[1] = Math.round(w[1]);
    if (state.snap) {                   // Snap to Grid coarsens that to 50
      w[0] = Math.round(w[0] / SNAP_STEP) * SNAP_STEP;
      w[1] = Math.round(w[1] / SNAP_STEP) * SNAP_STEP;
    }
    var c = state.corners[drag];
    state.corners[drag] = [w[0], w[1], c[2] === undefined ? 0 : c[2]];
    render();
    evt.preventDefault();
  });

  function endDrag(evt) {
    if (drag === null) { return; }
    drag = null;
    dragOffset = null;
    if (histDrag) { histPush(histDrag); histDrag = null; }
    try { svg.releasePointerCapture(evt.pointerId); } catch (e) {}
    // with the limits gone a corner can be dragged out of the window, so pull the
    // view back to fit once the drag ends (the scale changes only on release).
    // With Fit view on this always re-fits; with it off it only rescues a plot
    // that has left the frozen window.
    var b = bbox(state.corners);
    if (state.fitView || b.minx < view.minx || b.maxx > view.maxx ||
        b.miny < view.miny || b.maxy > view.maxy) {
      fitView();
    }
    render();   // also refreshes the Coordinates list (skipped while dragging)
  }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);

  function bindCheck(id, key) {

  bindCheck("ly-zones", "zones");
  bindCheck("ly-plants", "plants");
  bindCheck("ly-plabels", "plabels");

  bindCheck("ly-labels", "labels");

  (function () {

    var preset = document.getElementById("preset");

    var PRESETS = [
      { name: "4CP Square", c: [[0, 0, 0], [4600, 0, 0], [4600, -4600, 0], [0, -4600, 0]] },
      { name: "2CP Linear", c: [[0, 0, 0], [2300, 0, 0], [2300, -4600, 0], [0, -4600, 0]] },
      { name: "Tacticat BFD", c: [[0, 0, 0], [6900, 0, 0], [4600, -4600, 0], [2300, -4600, 0]] },
      { name: "7F Linear", c: [[0, 0, 0], [1200, 0, 0], [1200, -8400, 0], [0, -8400, 0]] },
      { name: "6(H+S)", c: [[0, 0, 0], [1500, 0, 0], [1500, -6600, 0], [0, -6600, 0]] },
      { name: "Triangle Solution 4F/2CP (+140%)", c: [[0, 0, 0], [2300, 0, 0], [2300, -4600, 0], [-2500, 0, 0]] },
      { name: "Triangle Solution 5H (+250%)", c: [[0, 0, 0], [2300, 0, 0], [2300, -5500, 0], [-3200, 0, 0]] },
      { name: "Triangle Solution 2.5CP (+290%)", c: [[0, 0, 0], [2300, 0, 0], [2300, -5750, 0], [-3450, 0, 0]] }
    ];
    var rw = document.getElementById("dim-w"), nw = document.getElementById("num-w");
    var rl = document.getElementById("dim-l"), nl = document.getElementById("num-l");

    var MIN_FRONTAGE = 800, MIN_FRONTAGE_SQ = 2000, MIN_LENGTH = 2000;
    function edges() {
      var c = state.corners;
      var w = Math.hypot(c[1][0] - c[0][0], c[1][1] - c[0][1]);
      var l = Math.hypot(c[3][0] - c[0][0], c[3][1] - c[0][1]);
      var p23 = Math.hypot(c[2][0] - c[3][0], c[2][1] - c[3][1]);
      var p12 = Math.hypot(c[2][0] - c[1][0], c[2][1] - c[1][1]);
      // Smallest control value: the Edge Mode floor, and the paired edge must
      // also stay at or above the 100-unit absolute minimum.

      var wMin = Math.max(wFloor, Math.ceil((w - p23 + 100) / 100) * 100);
      var lMin = Math.max(MIN_LENGTH, Math.ceil((l - p12 + 100) / 100) * 100);

      var e = edges();

      rl.max = nl.max = "20000";

    function validQuad(c) {

      for (var i = 0; i < 4; i++) {

        if (Math.hypot(b[0] - a[0], b[1] - a[1]) < 100 - 1e-6) { return false; }

      return state.corners.map(function (q) { return q.slice(); });

    // fixed (the pair keeps its difference). Blocked if that would collapse an
    // edge, i.e. any side of the quad ends at <= 0.
    function applyWidth(newW) {
      var c = state.corners, p0 = c[0], p1 = c[1], p2 = c[2], p3 = c[3];
      var oldW = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
      var oldP23 = Math.hypot(p2[0] - p3[0], p2[1] - p3[1]);
      var u1 = B.unit2(p1[0] - p0[0], p1[1] - p0[1]);   // P0 -> P1
      var u2 = B.unit2(p2[0] - p3[0], p2[1] - p3[1]);   // P3 -> P2
      if (!u1[0] && !u1[1]) { return false; }
      if (!u2[0] && !u2[1]) { return false; }
      var newP23 = oldP23 + (newW - oldW);
      if (newW <= 0 || newP23 <= 0) { return false; }
      var keep = snapshot();
      c[1] = [p0[0] + newW * u1[0], p0[1] + newW * u1[1], p1[2]];
      c[2] = [p3[0] + newP23 * u2[0], p3[1] + newP23 * u2[1], p2[2]];
      if (!validQuad(c)) { state.corners = keep; return false; }
      return true;
    }
    // Length: |P0-P3| is set directly; |P1-P2| moves by the same delta with P1
    // fixed. Blocked if that would collapse an edge.
    function applyLength(newL) {
      var c = state.corners, p0 = c[0], p1 = c[1], p2 = c[2], p3 = c[3];
      var oldL = Math.hypot(p3[0] - p0[0], p3[1] - p0[1]);
      var oldP12 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
      var v3 = B.unit2(p3[0] - p0[0], p3[1] - p0[1]);   // P0 -> P3
      var v2 = B.unit2(p2[0] - p1[0], p2[1] - p1[1]);   // P1 -> P2
      if (!v3[0] && !v3[1]) { return false; }
      if (!v2[0] && !v2[1]) { return false; }
      var newP12 = oldP12 + (newL - oldL);
      if (newL <= 0 || newP12 <= 0) { return false; }
      var keep = snapshot();
      c[3] = [p0[0] + newL * v3[0], p0[1] + newL * v3[1], p3[2]];
      c[2] = [p1[0] + newP12 * v2[0], p1[1] + newP12 * v2[1], p2[2]];
      if (!validQuad(c)) { state.corners = keep; return false; }
      return true;
    }
    // Make Square: the plot becomes a square whose first side is the street
    // edge.  P3 goes to the perpendicular of P0->P1 (same side it is on now)
    // and P2 = P3 + (P1 - P0), so all four sides are equal and right-angled.
    // This is the checkbox's own operation; the Length slider keeps its delta
    // rule and is disabled while the box is ticked.
    // Make Square: keep the street edge P0->P1 and grow the square on the side
    // the plot already occupies.  That side comes from the polygon's WINDING,
    // not from where P3 happens to sit: a corner lying on the street line (the
    // Triangle Solution 840 has P3 on y = 0) makes a P3-side test degenerate
    // (dot == 0), which used to build the square on the wrong side and flip the
    // outline clockwise — a winding the engine never produces.
    // A positive winding is preserved rather than repaired: a reversed outline
    // is the user's input, and the banner should keep saying so.
    function applySquare(side) {
      var c = state.corners, p0 = c[0], p1 = c[1], p2 = c[2], p3 = c[3];
      var u1 = B.unit2(p1[0] - p0[0], p1[1] - p0[1]);
      if (!u1[0] && !u1[1]) { return false; }
      var want = (B.winding(c) > 0) ? 1 : -1;        // < 0 = the engine's order
      var n = (want < 0) ? [u1[1], -u1[0]] : [-u1[1], u1[0]];
      var keep = snapshot();
      c[1] = [p0[0] + side * u1[0], p0[1] + side * u1[1], p1[2]];
      c[3] = [p0[0] + side * n[0], p0[1] + side * n[1], p3[2]];
      c[2] = [c[3][0] + (c[1][0] - p0[0]), c[3][1] + (c[1][1] - p0[1]), p2[2]];
      // Never emit a shape the model would reject: if the square came out with
      // the other winding, treat it as a refusal (the corners are restored).
      if (!validQuad(c) || ((B.winding(c) > 0) ? 1 : -1) !== want) {
        state.corners = keep;
        return false;
      }
      return true;
    }
    function commit(which, val) {
      var e = edges();
      if (which === "w") {
        var w = Math.max(e.wMin, Math.min(20000, Math.round(val / 100) * 100));
        var keep = snapshot();
        if (sq.checked) {
          if (!applySquare(w)) { state.corners = keep; }
        } else {
          applyWidth(w);
        }
      } else if (!sq.checked) {
        var l = Math.max(e.lMin, Math.min(20000, Math.round(val / 100) * 100));

      render();
    }
    sq.addEventListener("change", function () {
      var keep = histSnap();         // Make Square reshapes the plot

      if (sq.checked && !applySquare(Math.max(MIN_FRONTAGE_SQ, edges().w))) { sq.checked = false; }
      show();

      render();
      histPush(keep);
    });

      }

    }

      if (!state.manual) { return; }
      state.ruler = !state.ruler;
      syncRuler();
      render();
    });
    syncRuler();
    // Edge Mode controls: one history entry per gesture (grab ... release).

  // Locking re-imposes it, so the point snaps back onto its rail instead of

  var LOCKS = [
    { id: "lock-p0", key: "lock0",
      lockedTip: "P0 locked at the origin (0,0) - click to release it",
      freeTip: "P0 released, free corner - click to lock it back to the origin (0,0)",

    { id: "lock-p1", key: "lock1",

  function syncLocks() {
    LOCKS.forEach(function (L) {
