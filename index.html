      el.title = locked ? L.lockedTip : L.freeTip;
      el.setAttribute("aria-label", el.title);
    });
  }

  LOCKS.forEach(function (L) {
    document.getElementById(L.id).addEventListener("click", function () {
      var keep = histSnap();         // re-locking can move the point onto its rail
      state[L.key] = !state[L.key];
      if (state[L.key]) { L.onLock(); }
      syncLocks();
      render();
      histPush(keep);
    });
  });

  // ------------------------------------------------------------ undo / redo
  // A history entry is PLOT STATE ONLY: the four corners plus the two flags
  // that decide where a corner is allowed to land (Snap to Grid, P0/P1 locks).
  // Up to HIST_MAX entries each way.  Restoring never moves a stored point: a
  // flag that would "correct" a coordinate is switched off for that state --
  // e.g. corners stored off the 50-unit lattice come back with Snap off, and a
  // P1 at y != 0 releases the axis lock, so the coordinates land untouched.
  var HIST_MAX = 10;
  var histUndo = [], histRedo = [];
  var histDrag = null;   // snapshot taken at pointerdown
  var histEdge = null;   // snapshot taken when an Edge Mode control is grabbed

  function histSnap() {
    return {
      corners: state.corners.map(function (q) { return q.slice(); }),
      snap: !!state.snap,
      lock0: !!state.lock0,
      lock1: !!state.lock1,
      manual: !!state.manual,
      square: squareFlagGet ? squareFlagGet() : false
    };
  }
  // A state change is a corner MOVE.  Toggling Snap or a lock without moving a
  // point is not a state change, so it is not recorded: the flags travel with
  // the position change whose snapshot they were captured next to.
  function histSameCorners(a, b) {
    if (!a || !b) { return false; }
    for (var i = 0; i < 4; i++) {
      if (a.corners[i][0] !== b.corners[i][0] || a.corners[i][1] !== b.corners[i][1]) {
        return false;
      }
    }
    return true;
  }
  function histPush(keep) {
    if (!keep || histSameCorners(keep, histSnap())) { return; }
    histUndo.push(keep);
    if (histUndo.length > HIST_MAX) { histUndo.shift(); }
    histRedo.length = 0;             // a new edit drops the redo branch
    syncHist();
  }
  function histApply(s) {
    state.corners = s.corners.map(function (q) {
      return [q[0], q[1], q[2] === undefined ? 0 : q[2]];
    });
    // Flags follow the restored POSITION.
    //   * A lock is a pin: it re-engages whenever its point is back on the rail
    //     (locking a point that is already there moves nothing) and is released
    //     when the point sits off it.  Undoing a move of P0 therefore puts it
    //     back at the origin AND locked again.
    //   * Snap is a drag mode rather than a pin, so it is only forced OFF, never
    //     on: restoring off-lattice corners must never be "corrected" by it.
    state.snap = s.snap;
    for (var i = 0; i < 4; i++) {
      var c = state.corners[i];
      if (c[0] % SNAP_STEP !== 0 || c[1] % SNAP_STEP !== 0) { state.snap = false; }
    }
    state.lock0 = (state.corners[0][0] === 0 && state.corners[0][1] === 0);
    state.lock1 = (state.corners[1][1] === 0);
    // The mode is part of the state: restoring a step taken in Edge Mode has to
    // switch back to Edge Mode (and vice versa), or the two views would disagree
    // about the same corners.
    if (s.manual !== undefined) { state.manual = !!s.manual; }
    if (squareFlagSet) { squareFlagSet(s.square); }
    if (applyModeUi) { applyModeUi(); }
    if (syncUiFlags) { syncUiFlags(); }
    autoFit();
    render();
  }
  function histUndoOne() {
    if (!histUndo.length) { return; }
    histRedo.push(histSnap());
    if (histRedo.length > HIST_MAX) { histRedo.shift(); }
    histApply(histUndo.pop());
    syncHist();
  }
  function histRedoOne() {
    if (!histRedo.length) { return; }
    histUndo.push(histSnap());
    if (histUndo.length > HIST_MAX) { histUndo.shift(); }
    histApply(histRedo.pop());
    syncHist();
  }
  function syncHist() {
    var u = document.getElementById("undo"), r = document.getElementById("redo");
    u.disabled = histUndo.length === 0;
    r.disabled = histRedo.length === 0;
    // The label carries the depth of its own stack, e.g. "Undo (3)".
    u.textContent = histUndo.length ? "Undo (" + histUndo.length + ")" : "Undo";
    r.textContent = histRedo.length ? "Redo (" + histRedo.length + ")" : "Redo";
    u.title = histUndo.length
      ? "Undo the last plot change (" + histUndo.length + " of " + HIST_MAX + " stored)"
      : "Nothing to undo";
    r.title = histRedo.length
      ? "Redo the next plot change (" + histRedo.length + " of " + HIST_MAX + " stored)"
      : "Nothing to redo";
    u.setAttribute("aria-label", u.title);
    r.setAttribute("aria-label", r.title);
  }
  document.getElementById("undo").addEventListener("click", histUndoOne);
  document.getElementById("redo").addEventListener("click", histRedoOne);
  // Ctrl/Cmd+Z / Ctrl+Shift+Z (and Ctrl+Y) while the page has focus.
  document.addEventListener("keydown", function (evt) {
    if (!(evt.ctrlKey || evt.metaKey)) { return; }
    var k = (evt.key || "").toLowerCase();
    if (k === "z") {
      evt.preventDefault();
      if (evt.shiftKey) { histRedoOne(); } else { histUndoOne(); }
    } else if (k === "y") {
      evt.preventDefault();
      histRedoOne();
    }
  });
  syncHist();
  syncLocks();

  // copy the Model readout
  var copyBtn = document.getElementById("copy-model");
  function copyDone() {
    copyBtn.classList.add("done");
    copyBtn.title = "Copied";
    setTimeout(function () {
      copyBtn.classList.remove("done");
      copyBtn.title = "Copy model parameters";
    }, 1200);
  }
  function copyFallback(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); copyDone(); } catch (e) { /* ignore */ }
    document.body.removeChild(ta);
  }
  copyBtn.addEventListener("click", function () {
    var text = document.getElementById("status").innerText;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(copyDone, function () { copyFallback(text); });
    } else {
      copyFallback(text);
    }
  });

  window.addEventListener("resize", function () { M = metrics(); render(); });

  // URL presets.  Any of these apply a custom plot before the first render:
  //   ?p0=x,y&p1=x,y&p2=x,y&p3=x,y        explicit corners
  //   ?c=x0,y0,x1,y1,x2,y2,x3,y3          8 numbers in P0..P3 order
  //   ?c=x0,y0,x1,y1                      4 numbers -> axis-aligned rectangle
  // #c=... and a bare hash (#0,0,4600,0,...) work the same way.
  (function () {
    var nums = function (s) {
      var m = String(s || "").match(/-?\d+(?:\.\d+)?/g);
      return m ? m.map(Number) : [];
    };
    var pair = function (s) {
      var n = nums(s);
      return n.length >= 2 ? [n[0], n[1], 0] : null;
    };
    var q = {};
    (location.search.replace(/^\?/, "") + "&" + location.hash.replace(/^#/, "")).split("&").forEach(function (kv) {
      var i = kv.indexOf("=");
      if (i > 0) { q[kv.slice(0, i).toLowerCase()] = decodeURIComponent(kv.slice(i + 1)); }
      else if (kv && kv.indexOf(",") >= 0) { q[""] = kv; }
    });
    var c = null;
    var a = pair(q.p0), b = pair(q.p1), d = pair(q.p2), e = pair(q.p3);
    if (a && b && d && e) {
      c = [a, b, d, e];
    } else {
      var f = nums(q.c || q.corners || q.p || q[""]);
      if (f.length >= 8) {
        c = [[f[0], f[1], 0], [f[2], f[3], 0], [f[4], f[5], 0], [f[6], f[7], 0]];
      } else if (f.length >= 4) {
        // x0,y0,x1,y1 -> P0(x0,y0) P1(x1,y0) P2(x1,y1) P3(x0,y1)
        c = [[f[0], f[1], 0], [f[2], f[1], 0], [f[2], f[3], 0], [f[0], f[3], 0]];
      }
    }
    if (c) { state.corners = c; }
  })();

  fitView();
  render();
  window.__state = state;
  window.__render = render;
})();
</script>
</body></html>
